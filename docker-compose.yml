# Environnement de développement et de démonstration (données fictives).
services:
  referentiel-db:
    image: postgres:16
    environment:
      POSTGRES_DB: referentiel
      POSTGRES_USER: referentiel
      POSTGRES_PASSWORD: ${REFERENTIEL_DB_PASSWORD:?REFERENTIEL_DB_PASSWORD manquant dans .env}
      # Comptes de moindre privilège créés à l'initialisation (sql/referentiel/02_roles.sh)
      REFERENTIEL_IMPORT_PASSWORD: ${REFERENTIEL_IMPORT_PASSWORD:?REFERENTIEL_IMPORT_PASSWORD manquant dans .env}
      REFERENTIEL_API_PASSWORD: ${REFERENTIEL_API_PASSWORD:?REFERENTIEL_API_PASSWORD manquant dans .env}
    volumes:
      - referentiel_pgdata:/var/lib/postgresql/data
      # MPD et comptes appliqués automatiquement à la création de la base (volume vide)
      - ./sql/referentiel:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referentiel -d referentiel"]
      interval: 5s
      retries: 10

  pipeline:
    build: .
    env_file: .env
    # Même identifiant que l'utilisateur de la machine, pour écrire dans ./data
    user: "${UID_HOTE:-1000}"
    volumes:
      - ./data:/app/data
    depends_on:
      referentiel-db:
        condition: service_healthy
    profiles: ["pipeline"]

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "referentiel.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    # Port publié sur la machine uniquement (pas d'exposition directe sur Internet)
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      referentiel-db:
        condition: service_healthy
    read_only: true
    restart: unless-stopped
    profiles: ["api"]

volumes:
  referentiel_pgdata:
