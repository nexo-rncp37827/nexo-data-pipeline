name: CI référentiel clients

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=referentiel --cov-report=term-missing

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t referentiel:ci .
      - name: Les requêtes SQL et le point de lancement sont présents dans l'image
        run: |
          docker run --rm referentiel:ci python -c "from referentiel.extraction import nexo; [nexo.lire_requete(f) for f in nexo.REQUETES.values()]"
          docker run --rm referentiel:ci python -m referentiel.extraire --help
